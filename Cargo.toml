[package]
name = "picobar"
version = "0.2.0"
edition = "2024"
description = "Ultra-light menu bar / tray monitor for Claude and OpenCode usage and limit resets."
license = "MIT"
repository = "https://github.com/lido772/picobar"
readme = "README.md"
keywords = ["claude", "opencode", "menubar", "tray", "usage"]
categories = ["command-line-utilities", "gui"]

# Every dependency must be justified in docs/ARCHITECTURE.md (size budget).
[dependencies]
tao = "0.37.2"        # native event loop (NSApplication / Win32), no webview
tray-icon = "0.26.1"  # menu bar item / tray icon + native menus (muda)
softbuffer = { version = "0.4", default-features = false }  # blit our pixels into the popover window
ab_glyph = "0.2"      # rasterize text with the system's own fonts
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# OpenCode keeps its data in SQLite. Bundled: linking macOS's system
# libsqlite3 directly crashed on open, and Windows ships none.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"           # local time offset (already in the tree via tao)

[target.'cfg(target_os = "linux")'.dependencies]
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }  # local time offset

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
