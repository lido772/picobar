name: Release

# Asset names are part of the built-in updater's contract (src/update.rs):
#   PicoBar-<v>-macos-universal.dmg
#   PicoBar-<v>-windows-x64-portable.zip   (PicoBar.exe at the top level)
#   PicoBar-<v>-linux-x86_64.tar.gz        (picobar at the top level)
#   PicoBar-<v>-linux-aarch64.tar.gz       (picobar at the top level)
#   picobar_<v>_<deb-arch>.deb             (amd64 and arm64)
#   SHA256SUMS.txt
# Windows exe + installer are Authenticode-signed via SignPath when
# vars.SIGNPATH_ORGANIZATION_ID is set; see docs/SIGNING.md.
# SHA256SUMS.txt is computed in the release job, i.e. over signed files.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output picobar \
            target/aarch64-apple-darwin/release/picobar \
            target/x86_64-apple-darwin/release/picobar
      - name: Bundle PicoBar.app and the disk image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=PicoBar.app
          mkdir -p "$APP/Contents/MacOS"
          cp picobar "$APP/Contents/MacOS/picobar"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          scripts/make-dmg.sh "$APP" "PicoBar-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: PicoBar-*-macos-universal.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Upload unsigned PicoBar.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          retention-days: 1
          path: target/release/picobar.exe
      - name: Sign PicoBar.exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: picobar
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
      - name: Use signed PicoBar.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed-exe/picobar.exe target/release/picobar.exe -Force
          $st = (Get-AuthenticodeSignature target/release/picobar.exe).Status
          if ($st -ne 'Valid') { throw "picobar.exe signature: $st" }
      - name: Portable zip and installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/picobar.exe portable/PicoBar.exe
          Copy-Item packaging/windows/portable portable/portable
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "PicoBar-$version-windows-x64-portable.zip"
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DVersion=$version" "/DSource=$PWD\target\release\picobar.exe" "/O$PWD" packaging\windows\picobar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage installer under a fixed name
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item "PicoBar-$version-windows-x64-setup.exe" stage/PicoBar-setup.exe
      - name: Upload unsigned installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: stage/PicoBar-setup.exe
          retention-days: 1
      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: picobar
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - name: Use signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $dest = "PicoBar-$version-windows-x64-setup.exe"
          Copy-Item signed-setup/PicoBar-setup.exe $dest -Force
          $st = (Get-AuthenticodeSignature $dest).Status
          if ($st -ne 'Valid') { throw "$dest signature: $st" }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            PicoBar-*-windows-x64-portable.zip
            PicoBar-*-windows-x64-setup.exe

  linux:
    # Oldest supported runners: binaries also run on newer glibc versions.
    # Each arch builds natively on its own runner.
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: tar.gz and .deb
        run: bash scripts/package-linux.sh "${GITHUB_REF_NAME#v}" target/release/picobar .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            PicoBar-*-linux-*.tar.gz
            picobar_*_*.deb

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum PicoBar-* picobar_* > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "PicoBar ${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Point the Homebrew formula at this tag
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          git fetch origin main && git checkout -B main origin/main
          sed -i -e "s|^  url \".*\"|  url \"$URL\"|" -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/picobar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "brew: picobar ${GITHUB_REF_NAME}" && git push origin main
