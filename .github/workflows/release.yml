name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output picobar \
            target/aarch64-apple-darwin/release/picobar \
            target/x86_64-apple-darwin/release/picobar
      - name: Bundle PicoBar.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=PicoBar.app
          mkdir -p "$APP/Contents/MacOS"
          cp picobar "$APP/Contents/MacOS/picobar"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          scripts/make-dmg.sh "$APP" "PicoBar-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: PicoBar-*-macos-universal.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          Copy-Item target/release/picobar.exe PicoBar.exe
          Compress-Archive -Path PicoBar.exe -DestinationPath "PicoBar-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PicoBar-*-windows-x64.zip

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum PicoBar-* > SHA256SUMS.txt && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "PicoBar ${GITHUB_REF_NAME}" --notes-file notes.md
